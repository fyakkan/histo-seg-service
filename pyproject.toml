[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histo-seg-service"
version = "0.1.0"
description = "Blood vessel segmentation in H&E histopathology tiles, served as a monitored ML service (portfolio project, public data)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Furkan Yakkan" }]
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements/*.txt, not here.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "train: needs PyTorch and a trained model (local only, skipped in CI)",
]
