# Local demo stack: the API and Prometheus. Ports are bound to 127.0.0.1 only,
# so nothing is reachable from other machines on the network.
# Needs artifacts/model.onnx first: `make model` (download release) or `make export`.

services:
  api:
    build: .
    image: histo-seg-service:local
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped
