# Data settings. Paths are relative to HISTOSEG_DATA_DIR (default: ./data) unless noted.

dataset:
  # BCSS (Amgad et al., Bioinformatics 2019), Hugging Face mirror of the original release.
  # Angelou0516/BCSS redirects to this same repository.
  repo_id: MedOtter/BCSS
  # Pinned commit: every download gets exactly the same files, even if the mirror changes.
  revision: 502d4a3fbc77dbaca6f4664c19e2379ff077d418
  license: CC0-1.0
  # Checked on the pinned revision: 151 ROIs in 10 parquet shards (~4.9 GB),
  # one ROI per patient, patient_id = TCGA-XX-YYYY prefix of image_id.
  num_rois: 151
  # Source resolution of the ROIs. The mirror's images are colour-normalised upstream.
  source_mpp: 0.25

# Mask values used by this project (the full 22-class table is on the dataset card).
mask_codes:
  outside_roi: 0
  tumor: 1
  blood_vessel: 18

download:
  # Everything goes under <HISTOSEG_DATA_DIR>/<subdir>/:
  #   parquet/  original shards   images/, masks/  one PNG per ROI   metadata.csv
  subdir: bcss

split:
  # Patients (not tiles) are shuffled and split, so no patient is in two splits.
  seed: 42
  fractions: {train: 0.70, val: 0.15, test: 0.15}
  output: configs/splits.json  # relative to the repo root; committed

tiling:
  target_mpp: 0.5         # resample 0.25 -> 0.5 um/px (half the width and height)
  tile_size: 256
  max_outside_roi: 0.5    # drop tiles where more than half the pixels are outside the annotated region
  subdir: tiles           # <HISTOSEG_DATA_DIR>/tiles/{images,masks}/, tiles.csv

target:
  # Segmentation target, chosen with the decision rule documented in reports/data_report.md:
  # switch to tumor if the training split has fewer than min_train_tiles tiles containing
  # vessel pixels, or if vessel pixels are below min_pixel_fraction of labelled pixels.
  name: blood_vessel
  code: 18
  fallback: tumor
  min_train_tiles: 200
  min_pixel_fraction: 0.005
