name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can only read the repository unless a job asks for more.
permissions:
  contents: read

env:
  IMAGE: histo-seg-service:ci
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install serving and test dependencies (no PyTorch)
        run: |
          pip install -r requirements/serve.txt -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Download model-v1 and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: make model
      - name: Tests with coverage
        run: pytest -m "not train" --cov=histoseg --cov-report=term --cov-report=xml --cov-fail-under=35
      - name: Alert rule tests (promtool)
        run: make test-alerts
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the whole history, not only the last commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install -r requirements/security.txt
      - name: Bandit (fail on medium or high severity)
        run: bandit -r src -ll
      - name: pip-audit (fail on known vulnerabilities)
        run: |
          pip-audit -r requirements/serve.txt -r requirements/dev.txt
          pip-audit --no-deps -r requirements/train.txt
      - name: gitleaks (secrets in git history)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact

  docker:
    needs: lint-test
    runs-on: ubuntu-24.04
    # Only this job may write packages, and it only pushes on main (see the last step).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download model-v1 and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: make model
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Trivy (fail on fixable HIGH/CRITICAL vulnerabilities)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - name: Smoke test
        run: bash scripts/smoke_test.sh "$IMAGE"
      - name: Push to GHCR (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in "$GITHUB_SHA" main; do
            docker tag "$IMAGE" "$REGISTRY_IMAGE:$tag"
            docker push "$REGISTRY_IMAGE:$tag"
          done
          docker logout ghcr.io

  # Deploys to a throwaway kind cluster on the runner: local-style test, not a production deployment.
  k8s:
    if: github.event_name == 'pull_request'
    needs: lint-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download model-v1 and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: make model
      - name: Install kind (checksum verified)
        env:
          KIND_VERSION: v0.33.0
        run: |
          base="https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION"
          curl -fsSLo kind "$base/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "$base/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256sum)  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          rm kind kind.sha256sum
      - name: Deploy 2 replicas to kind and smoke test
        run: make k8s-up KIND=kind
      - name: Show pod details on failure
        if: failure()
        run: kubectl --context kind-histo-seg describe pods -l app=histo-seg
