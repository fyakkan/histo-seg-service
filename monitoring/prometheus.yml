# Prometheus scrapes the API's /metrics every 5 seconds and evaluates the alert rules.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: histo-seg-api
    static_configs:
      - targets: ["api:8000"]  # the service name from docker-compose.yml
